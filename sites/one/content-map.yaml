# Allowlist for one.majesta.net. Paths are relative to the MajestaNet/one pin.
# The Starlight build includes these files; it does not copy them as a second wiki.
# Fail docs-check if a sources path is missing at the pin.
# If pin is unset, do not fetch main as a substitute.

pages:
  /:
    sources: [README.md, docs/glossary.md]
    include: false
    note: Short rewrite of product nouns. Do not dump the full README.
  /install:
    sources: [docs/self-host.md]
  /connect:
    sources: [docs/builder-connect.md, docs/customer-connect.md]
  /cli:
    sources: [docs/customer-repo.md, docs/customer-developer-workflow.md]
  /api/families:
    sources: [docs/api-families.md]
    include: true
    note: Overview only. Do not paste this file onto the five family routes.
  /api/revision:
    sources: [docs/adr/025-api-revision-versioning.md]
    note: Pin One-API-Revision; min/current. Not a parallel site tree.
  /api/client:
    sources: [docs/api/client.md]
    include: true
  /api/metadata:
    sources: [docs/api/metadata.md]
    include: true
  /api/deploy:
    sources: [docs/api/deploy.md]
    include: true
  /api/ops:
    sources: [docs/api/ops.md]
    include: true
  /api/auth:
    sources: [docs/api/auth.md]
    include: true
  /modules:
    sources: [docs/modules/README.md, docs/modules/*.md]
    include: true
  /objects:
    sources: [docs/objects.md]
    include: true
    note: Static managed-object catalog. Not GET /describe. Custom objects stay on the install.
  /customization:
    sources: [docs/customer-customizations.md]
    include: true
  /upgrades:
    sources: [docs/product-upgrades.md, docs/ops.md]
    note: Customer cut — image roll vs Deploy promote.
  /security:
    sources: [docs/security.md]
    note: Pointer to SECURITY.md. No live vuln detail.
  /releases:
    sources: [docs/release-cicd.md]
    note: Customer cut — tag, digest pin, no channel-roll internals.
